name: 功能建议
description: 提出新能力、体验改进或文档补强
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的真实场景，而不是只给一个方案——这样更容易判断它是否该进主线。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不顺手？在什么场景下会卡住？
      placeholder: 一份 200 页的说明书，检索只召回 5 个分块，跨页结论容易漏。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 你希望的交互或接口形态；有替代方案也一并写
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 文档解析与入库（backend/app/services/ingest.py, text.py）
        - 向量化与检索（embeddings.py, retrieval.py）
        - 问答与引用（llm.py, api/chat.py）
        - 前端交互（frontend/src）
        - 桌面端与打包（src-tauri）
        - 文档与交付物（docs、scripts）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已试过的替代方案
      description: 现有配置能否绕过？例如调大 RETRIEVE_TOP_K / CHUNK_SIZE
    validations:
      required: false
